<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGC Calculadora</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#08152f;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
}
.home-nav{
    margin-bottom:25px;
}

.home-nav a{

    display:inline-block;

    background:#22c55e;

    color:white;

    text-decoration:none;

    padding:10px 18px;

    border-radius:10px;

    font-weight:bold;

    transition:.3s;

}

.home-nav a:hover{

    background:#16a34a;

}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

h1{
    text-align:center;
    color:#22c55e;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.grid-4{
    grid-template-columns:repeat(4,1fr);
}

@media(max-width:900px){

    .grid-4{
        grid-template-columns:1fr;
    }

}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    box-sizing:border-box;
    font-size:16px;
}

.required{
    background:#fff3a3;
}

.completed{
    background:#ffffff;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.calculate-btn{
    background:#22c55e;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    padding:15px;
}

.reset-btn{
    background:#ef4444;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    padding:15px;
}

.results{
    background:#07122d;
    border-radius:20px;
    padding:25px;
}

.result-item{
    margin-bottom:20px;
}

.result-title{
    font-size:18px;
    margin-bottom:8px;
}

.result-value{
    color:#68d46b;
    font-size:32px;
    font-weight:bold;
}

.warning{
    color:#ff7b7b;
    font-weight:bold;
    margin-bottom:20px;
}

.results-card{
    margin-top:20px;
}

.kpi-grid{
    display:grid;
    grid-template-columns:
        1.4fr
        1fr
        1fr
        1fr;
    gap:20px;
    margin-top:20px;
}

.kpi-card{
    background:#07122d;
    border-radius:16px;
    padding:25px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
}

.kpi-title{
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

.kpi-value{
    color:#22c55e;
    font-size:42px;
    font-weight:bold;
    min-height:50px;
}

@media(max-width:900px){

    .kpi-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:900px){

    .result-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="home-nav">

    <a href="index.html">

        🏠 Centro de operaciones AGC

    </a>

</div>


<h1>Calculadora</h1>

<div class="card">

<h2>Operación</h2>

<div class="grid grid-4">

    <div>
        <label>Instrumento</label>
        <select id="instrument" class="track required">
            <option value="">Seleccionar</option>
            <option value="MNQ">MNQ</option>
            <option value="MES">MES</option>
            <option value="MGC">MGC</option>
        </select>
    </div>

    <div>
        <label>Capital</label>
        <input type="text"
               id="account"
               class="track required">
    </div>

    <div>
        <label>Riesgo $</label>
        <input type="text"
               id="riskDollar"
               class="track required">
    </div>

    <div>
        <label>Riesgo %</label>
        <input type="text"
               id="riskPercent"
               class="track required">
    </div>

</div>

<div class="grid grid-4" style="margin-top:20px;">

    <div>
        <label>Compra/Venta</label>
        <select id="side" class="track required">
            <option value="">Seleccionar</option>
            <option value="BUY">Compra</option>
            <option value="SELL">Venta</option>
        </select>
    </div>

    <div>
        <label>Entrada</label>
        <input type="text"
               id="entry"
               class="track required">
    </div>

    <div>
        <label>Stop Loss</label>
        <input type="text"
               id="stop"
               class="track required">
    </div>

    <div>
        <label>Take Profit</label>
        <input type="text"
               id="tp"
               class="track required">
    </div>

</div>

<div class="buttons">

<button class="calculate-btn" onclick="calculate()">
CALCULAR
</button>

<button class="reset-btn" onclick="resetPlanner()">
REINICIAR
</button>

</div>

</div>

<div class="card results-card">

    <h2>Resultado</h2>

    <div id="validation" class="warning"></div>

    <div class="kpi-grid">

        <div class="kpi-card">

            <div class="kpi-title">
                Contratos Totales
            </div>

            <div id="contracts"
                 class="kpi-value">
            </div>

        </div>

        <div class="kpi-card">

            <div class="kpi-title">
                Distancia Stop
            </div>

            <div id="stopDistance"
                 class="kpi-value">
            </div>

        </div>

        <div class="kpi-card">

            <div class="kpi-title">
                Distancia TP
            </div>

            <div id="tpDistance"
                 class="kpi-value">
            </div>

        </div>

        <div class="kpi-card">

            <div class="kpi-title">
                RR
            </div>

            <div id="rr"
                 class="kpi-value">
            </div>

        </div>

    </div>

</div>

<script>

function money(value){

    return value.toLocaleString("en-US",{
        style:"currency",
        currency:"USD"
    });

}

function getInstrument(symbol){

    switch(symbol){

        case "MNQ":
            return {
                pointValue:2,
                tickValue:0.50
            };

        case "MES":
            return {
                pointValue:5,
                tickValue:1.25
            };

        case "MGC":
            return {
                pointValue:10,
                tickValue:1
            };

        default:
            return null;

    }

}

function actualizarRiesgoPorcentaje(){

    const capital = getNumber("account");
    const riesgoDolar = getNumber("riskDollar");

    if(
        capital > 0 &&
        riesgoDolar > 0
    ){

        const porcentaje =
            (riesgoDolar * 100) /
            capital;

        document.getElementById(
            "riskPercent"
        ).value =
        porcentaje
        .toFixed(2)
        .replace(".",",");
        
    
        updateColors();

    }

}

function actualizarRiesgoDolar(){

    const capital =
        getNumber("account");

    const riesgoPercent =
    Number(
        document
        .getElementById("riskPercent")
        .value
        .replace(",",".")
    ) || 0;

    if(
        capital > 0 &&
        riesgoPercent > 0
    ){

        const riesgoDolar =
            (capital * riesgoPercent)
            / 100;

            document.getElementById(
            "riskDollar"
        ).value =
        formatNumber(
            riesgoDolar.toFixed(0)
        );
        
        
        updateColors();

    }

}

function getNumber(id){

    return Number(
        document
        .getElementById(id)
        .value
        .replace(/\./g,"")
        .replace(/,/g,".")
        .trim()
    ) || 0;

}

function formatNumber(value){

    return Number(value)
    .toLocaleString("es-CO");

}

function formatThousandsInput(input){

    const valor =
    input.value.replace(/\D/g,"");

    if(valor === ""){

        input.value = "";
        return;

    }

    input.value =
    Number(valor)
    .toLocaleString("es-CO");

}

function updateColors(){

    document
    .querySelectorAll(".track")
    .forEach(field => {

        if(
            field.value === "" ||
            field.value === "Seleccionar"
        ){

            field.classList.remove("completed");
            field.classList.add("required");

        }else{

            field.classList.remove("required");
            field.classList.add("completed");

        }

    });

}

function calculate(){

    const instrument =
    document.getElementById("instrument").value;

    const capital =
    getNumber("account");

    const riskPercent =
    Number(
        document
        .getElementById("riskPercent")
        .value
        .replace(",",".")
    ) || 0;

    const entry =
    getNumber("entry");

    const stop =
    getNumber("stop");

    const tp =
    getNumber("tp");

    if(
        !instrument ||
        !capital ||
        !riskPercent ||
        !entry ||
        !stop ||
        !tp
    ){

        document.getElementById(
            "validation"
        ).innerText =
        "Debes diligenciar todos los campos obligatorios.";

        return;

    }

    const data =
    getInstrument(instrument);

    const riskMoney =
    (capital * riskPercent) / 100;

    const stopDistance =
    Math.abs(entry - stop);

    const tpDistance =
    Math.abs(entry - tp);

    const riskPerContract =
    stopDistance * data.pointValue;

    const contracts =
    Math.floor(
        riskMoney / riskPerContract
    );

    const rr =
    stopDistance > 0
    ? (tpDistance / stopDistance).toFixed(2)
    : "0.00";

    document.getElementById(
        "validation"
    ).innerText = "";

    document.getElementById(
        "contracts"
    ).innerText =
    formatNumber(contracts);

    document.getElementById(
        "stopDistance"
    ).innerText =
    stopDistance.toFixed(2);

    document.getElementById(
        "tpDistance"
    ).innerText =
    tpDistance.toFixed(2);

    document.getElementById(
        "rr"
    ).innerText =
    "1:" + rr;

}

function resetPlanner(){

    document
    .querySelectorAll(".track")
    .forEach(field => {

        field.value = "";

    });

    document.getElementById("instrument").selectedIndex = 0;

    document.getElementById("side").selectedIndex = 0;

    [
        "contracts",
        "stopDistance",
        "tpDistance",
        "rr",
        "validation"
    ]
    .forEach(id => {

        document.getElementById(id).innerText = "";

    });

    updateColors();

}

document
.getElementById("riskDollar")
.addEventListener(
    "input",
    function(){

        formatThousandsInput(this);

        actualizarRiesgoPorcentaje();

    }
);

document
.getElementById("riskPercent")
.addEventListener(
    "input",
    actualizarRiesgoDolar
);

document
.getElementById("riskPercent")
.addEventListener(
    "blur",
    function(){

        let valor =
        this.value
        .replace(",", ".");

        valor =
        Number(valor);

        if(!isNaN(valor) && valor > 0){

            this.value =
            valor
            .toFixed(2)
            .replace(".", ",");

        }

    }
);

document
.getElementById("account")
.addEventListener(
    "input",
    function(){

        formatThousandsInput(this);

    }
);

document
.getElementById("riskDollar")
.addEventListener(
    "input",
    function(){

        const cursor = this.selectionStart;

        formatThousandsInput(this);

        actualizarRiesgoPorcentaje();

    }
);

document
.getElementById("account")
.addEventListener(
    "input",
    function(){

        formatThousandsInput(this);

    }
);

document
.getElementById("entry")
.addEventListener(
    "input",
    function(){

        formatThousandsInput(this);

    }
);

document
.getElementById("stop")
.addEventListener(
    "input",
    function(){

        formatThousandsInput(this);

    }
);

document
.getElementById("tp")
.addEventListener(
    "input",
    function(){

        formatThousandsInput(this);

    }
);

document.querySelectorAll(".track")
.forEach(field=>{

    field.addEventListener(
        "input",
        updateColors
    );

});

updateColors();

</script>

</body>
</html>
